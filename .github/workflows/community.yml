# Once a week: recalculates the community leaderboard (COMMUNITY.md) from the issues and
# publishes it only when it changed. Can also be started by hand (Actions > Community > Run).
name: Community

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calculate the leaderboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/community.mjs .
      - name: Publish it when it changed
        run: |
          if git diff --quiet -- COMMUNITY.md; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMMUNITY.md
          git commit -m "Community: weekly update"
          git push
