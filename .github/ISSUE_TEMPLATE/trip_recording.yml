name: Send a trip recording (CSV)
description: Help calibrate Drive HUD (speed, GPS, potholes, sensors) with a recorded trip
labels: ["trip-data"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Recorded trips help tune the app for every phone and car.

        **How to record:** Settings › *Record trip sensors* (on), drive, then at the end of the trip tap *Send CSV* and save the file. Drag the `.csv` file (or a `.zip` of it) into the box below.

        > [!WARNING]
        > **Issues are public.** The CSV has the GPS track of the trip, so anyone can see where you drove. Do not send a trip that starts or ends at your home or work: start recording after leaving and stop it before arriving. The file has no name or email, only a random id of your installation.
  - type: textarea
    id: file
    attributes:
      label: The CSV file
      description: Drag the file here (GitHub accepts .csv and .zip up to 25 MB).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone
      placeholder: e.g. Samsung S24 FE, Android 15
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car and where the phone was
      placeholder: e.g. Fiat Panda 2015, phone flat on the dashboard with a non-slip mat
  - type: dropdown
    id: roads
    attributes:
      label: Roads
      multiple: true
      options:
        - Town
        - Country roads
        - Motorway
        - Cobbles / bad road
  - type: textarea
    id: notes
    attributes:
      label: What happened on the trip
      description: Anything worth checking, with the time if you remember (a pothole at 14:32, the speed looked wrong in a tunnel, a wrong turn…)
