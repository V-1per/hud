name: Send a trip recording
description: Help tune Drive HUD (speed, GPS, potholes, sensors) with a recorded trip
labels: ["trip-data"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Recorded trips help tune the app for every phone and car.

        **How to record:** Settings › *Record trip sensors* (on), drive, then at the end of the trip tap *Send via GitHub*. This form opens filled in: attach the `drive-hud-sensors-….hudrec.txt` file from Downloads in the box below.

        The file is encrypted: only the developer can open it.
  - type: textarea
    id: file
    attributes:
      label: The recording
      description: Attach the .hudrec.txt file from Downloads (tap the box, then "Attach files").
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone
      placeholder: e.g. Samsung S24 FE, Android 15
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car and where the phone was
      placeholder: e.g. Fiat Panda 2015, phone flat on the dashboard with a non-slip mat
  - type: dropdown
    id: roads
    attributes:
      label: Roads
      multiple: true
      options:
        - Town
        - Country roads
        - Motorway
        - Cobbles / bad road
  - type: textarea
    id: notes
    attributes:
      label: What happened on the trip
      description: Anything worth checking, with the time if you remember (a pothole at 14:32, the speed looked wrong in a tunnel, a wrong turn…)
