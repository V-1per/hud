name: Suggest an improvement
description: An idea to make the app better or easier to use
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you change or add, and why would it help?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 2.0
